<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <link rel="shortcut icon" href="static/nigeerhuox16.ico.jpg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>love</title>
    <link rel="stylesheet" href="./static/style.css">
</head>

<body>
    <div class="scene-glow scene-glow-left"></div>
    <div class="scene-glow scene-glow-right"></div>
    <div class="floating-hearts" aria-hidden="true">
        <span>❤</span><span>❤</span><span>❤</span><span>❤</span><span>❤</span>
    </div>

    <img class="music-toggle" src="static/music.png"
        alt="toggle music"
        onclick="let m = document.querySelector('.song-audio-autoplay'); if (m.paused ) {m.play(); this.className = 'music-toggle rotateImages'} else {m.pause(); this.className = 'music-toggle'}">
    <audio class="song-audio-autoplay" controls loop autoplay style="display: none;visibility: hidden">
        <source src="static/因为我喜欢你.flac">
        </source>
        Your browser isn't invited for super fun audio time.
    </audio>
    <style type="text/css">
        .rotateImages {
            -webkit-animation: myRotate 10s linear infinite;
            animation: myRotate 10s linear infinite;
        }

        @-webkit-keyframes myRotate {
            0% {
                -webkit-transform: rotate(0deg);
            }

            50% {
                -webkit-transform: rotate(180deg);
            }

            100% {
                -webkit-transform: rotate(360deg);
            }
        }

        @keyframes myRotate {
            0% {
                -webkit-transform: rotate(0deg);
            }

            50% {
                -webkit-transform: rotate(180deg);
            }

            100% {
                -webkit-transform: rotate(360deg);
            }
        }
    </style>

    <main class="love-frame">
        <section class="love-hero">
            <p class="hero-kicker">A little love letter in motion</p>
            <div class="pass-time">
                <p class="finalText"></p>
                <p class="time-counter">
                    <span class="time-pill"><span class="kwy days"></span><small>天</small></span>
                    <span class="time-pill"><span class="kwy hours"></span><small>时</small></span>
                    <span class="time-pill"><span class="kwy minutes"></span><small>分</small></span>
                    <span class="time-pill"><span class="kwy seconds"></span><small>秒</small></span>
                </p>
            </div>
            <div class="love-message-panel">
                <marquee id="marquee" direction="up" scrollamount="2" class="love-message"></marquee>
            </div>
        </section>

        <section class="memory-canvas" aria-label="romantic memories">
            <div id="pBg1cNNqT-an-obj-2"><img height="180" width="500" src="./static/boy-girl/2000.jpg" alt="romantic banner"></div>
            <div id="pBg1cNNqT-an-obj-3">

                <div id="pBg1cNNqT-an-obj-9"><img height="113" width="85" src="./static/boy-girl/2000(2).jpg" alt="memory"></div>
                <div id="pBg1cNNqT-an-obj-10"><img height="113" width="85" src="./static/boy-girl/2000(2).jpg" alt="memory"></div>
                <div id="pBg1cNNqT-an-obj-11"><img height="113" width="85" src="./static/boy-girl/2000(2).jpg" alt="memory"></div>
                <div id="pBg1cNNqT-an-obj-12"><img height="113" width="85" src="./static/boy-girl/2000(2).jpg" alt="memory"></div>
                <div id="pBg1cNNqT-an-obj-13"><img height="113" width="85" src="./static/boy-girl/2000(2).jpg" alt="memory"></div>
                <div id="pBg1cNNqT-an-obj-14"><img height="113" width="85" src="./static/boy-girl/2000(2).jpg" alt="memory"></div>
                <div id="pBg1cNNqT-an-obj-15"><img height="113" width="85" src="./static/boy-girl/2000(2).jpg" alt="memory"></div>
                <div id="pBg1cNNqT-an-obj-16"><img height="113" width="85" src="./static/boy-girl/2000(2).jpg" alt="memory"></div>
                <div id="pBg1cNNqT-an-obj-17"><img height="113" width="85" src="./static/boy-girl/2000(2).jpg" alt="memory"></div>

            </div>
        </section>
    </main>

    <div id="gallery-trigger" class="gallery-trigger">
        <div class="folder-icon">
            <div class="folder-tab"></div>
            <div class="folder-body">
                <span class="heart-symbol">❤</span>
            </div>
        </div>
        <p class="trigger-text"></p>
    </div>

    <div id="gallery-overlay" class="gallery-overlay hidden">
        <div class="gallery-close" onclick="closeGallery()">×</div>
        <div class="gallery-content" id="gallery-content">
        </div>
    </div>

    <script src="config.js"></script>
    <script src="static/index.js"></script>
