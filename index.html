<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <link rel="shortcut icon" href="static/nigeerhuox16.ico.jpg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <meta name="theme-color" content="#6f1d3a">
    <title>我们</title>
    <link rel="stylesheet" href="./static/style.css">
</head>

<body>
    <div class="scene-glow scene-glow-left"></div>
    <div class="scene-glow scene-glow-right"></div>
    <div class="floating-hearts" aria-hidden="true">
        <span>❤</span><span>❤</span><span>❤</span><span>❤</span><span>❤</span>
    </div>

    <img class="music-toggle" src="static/music.png"
        alt="toggle music"
        onclick="let m = document.querySelector('.song-audio-autoplay'); if (m.paused ) {m.play(); this.className = 'music-toggle rotateImages'} else {m.pause(); this.className = 'music-toggle'}">
    <audio class="song-audio-autoplay" controls loop autoplay style="display: none;visibility: hidden">
        <source src="static/因为我喜欢你.flac">
        </source>
        Your browser isn't invited for super fun audio time.
    </audio>
    <style type="text/css">
        .rotateImages {
            -webkit-animation: myRotate 10s linear infinite;
            animation: myRotate 10s linear infinite;
        }

        @-webkit-keyframes myRotate {
            0% {
                -webkit-transform: rotate(0deg);
            }

            50% {
                -webkit-transform: rotate(180deg);
            }

            100% {
                -webkit-transform: rotate(360deg);
            }
        }

        @keyframes myRotate {
            0% {
                -webkit-transform: rotate(0deg);
            }

            50% {
                -webkit-transform: rotate(180deg);
            }

            100% {
                -webkit-transform: rotate(360deg);
            }
        }
    </style>

    <main class="love-frame">
        <section class="love-hero">
            <p class="hero-kicker">CINEMATIC LOVE DIARY</p>
            <h1 class="hero-title">2025.11.23</h1>
            <p class="hero-subtitle">我们的故事，这一天开始</p>
            <div class="hero-portrait-wrap">
                <figure class="hero-portrait">
                    <img src="./static/boy-girl/微信图片_20260426171112_444_5.jpg" alt="our anime portrait">
                </figure>
                <p class="hero-quote">把喜欢定格成一张片头海报，让后面的每一帧都记得起点。</p>
            </div>
            <div class="pass-time">
                <p class="finalText"></p>
                <p class="time-counter">
                    <span class="time-pill"><span class="kwy days"></span><small>天</small></span>
                    <span class="time-pill"><span class="kwy hours"></span><small>时</small></span>
                    <span class="time-pill"><span class="kwy minutes"></span><small>分</small></span>
                    <span class="time-pill"><span class="kwy seconds"></span><small>秒</small></span>
                </p>
            </div>
            <div class="love-message-panel">
                <marquee id="marquee" direction="up" scrollamount="2" class="love-message"></marquee>
            </div>
            <div class="support-note">
                <p>以后有我陪着你，不要再独自流泪了。</p>
                <p>慢慢来，宝宝已经很勇敢了。爱会一直陪着你，我陪你把每一个明天重新过好，一起去看更远的风景。</p>
                <p>抱抱陈思如宝宝，我是爱你的田鑫科，永远爱你</p>
            </div>
        </section>

        <section class="memory-canvas memory-story" aria-label="romantic memories">
            <div class="story-badge">The story we keep returning to</div>
            <div class="story-grid">
                <figure class="story-photo story-photo-hero">
                    <img src="./static/boy-girl/微信图片_20260426171112_444_5.jpg" alt="our anime portrait">
                    <figcaption>
                        <strong>小羊和小狗</strong><br>
                        像片头海报一样，先把“我们”安静而正式地写进去。
                    </figcaption>
                </figure>
                <figure class="story-photo story-photo-side">
                    <img src="./static/photos/1.爱意/1.jpg" alt="romantic memory">
                    <figcaption>漂亮的鲜花和美女</figcaption>
                </figure>
                <figure class="story-photo story-photo-side">
                    <img src="./static/photos/1.爱意/4.jpg" alt="romantic memory">
                    <figcaption>世界最美的女人有力竞争者报名表</figcaption>
                </figure>
                <figure class="story-photo story-photo-wide">
                    <img src="./static/photos/2.假期/psc.jpg" alt="romantic memory">
                    <figcaption>王之蔑视</figcaption>
                </figure>
                <figure class="story-photo story-photo-medium">
                    <img src="./static/photos/3.绍兴/psc (1).jpg" alt="romantic memory">
                    <figcaption>最喜欢的一张合照</figcaption>
                </figure>
                <figure class="story-photo story-photo-medium">
                    <img src="./static/photos/1.爱意/10.jpg" alt="romantic memory">
                    <figcaption>来一张普普通通的合照（并非普通）</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <div id="gallery-trigger" class="gallery-trigger">
        <div class="folder-icon">
            <div class="folder-tab"></div>
            <div class="folder-body">
                <span class="heart-symbol">❤</span>
            </div>
        </div>
        <p class="trigger-text"></p>
    </div>

    <div id="gallery-overlay" class="gallery-overlay hidden">
        <div class="gallery-close" onclick="closeGallery()">×</div>
        <div class="gallery-content" id="gallery-content">
        </div>
    </div>

    <script src="config.js"></script>
    <script src="static/index.js"></script>
    <script src="static/gallery.js"></script>
</body>

</html>
